---
- name: Check kernel patch
  hosts: cos8
  tasks:
    - name: Find all files in the loader entries directory
      ansible.builtin.find:
        paths: /boot/loader/entries
        file_type: file
      register: found_files

    - name: Print file paths and modification times
      ansible.builtin.debug:
        msg: "File: {{ item.path }} | Modified: {{ '%Y-%m-%d %H:%M:%S' | strftime(item.mtime) }}"
      loop: "{{ found_files.files }}"
      loop_control:
        label: "{{ item.path }}"
