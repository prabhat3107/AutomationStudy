---
- name: Set facts and calculate average
  hosts: all               # Target your 5 hosts here
  gather_facts: false
  tasks:
    - name: Get Active Items
      ansible.builtin.shell:
        cmd: /home/prabhat/get_value.sh
      register: active_items
      changed_when: false

    - name: Set a unique item_count for each host
      set_fact:
        item_count: "{{ active_items.stdout | int }}"

    - name: Display individual host counts
      debug:
        msg: "Host {{ inventory_hostname }} has item_count = {{ item_count }}"

    - name: Extract facts and calculate average
      run_once: true       # Run this task exactly once
      delegate_to: localhost # Execute the calculation on the control machine
      vars:
        # Using ansible_play_hosts correctly grabs the 5 target hosts from this play
        all_counts: "{{ ansible_play_hosts | map('extract', hostvars, 'item_count') | map('int') | list }}"
        total_sum: "{{ all_counts | sum }}"
        host_count: "{{ ansible_play_hosts | length }}"
        calculated_average: "{{ total_sum | int / host_count | int }}"
        rebalance_items: "{{ total_sum | int - calculated_average | int }}"
      block:
        - name: Print the collected metrics
          debug:
            msg:
              - "all_counts: {{ all_counts }}"
              - "total_sum: {{ total_sum }}"
              - "host_count: {{ host_count }}"
              - "shared_average: {{ calculated_average }}"
              - "rebalance_items: {{ rebalance_items }}"

        - name: Save the average to a shared fact space
          set_fact:
            shared_average: "{{ calculated_average }}"
            rebalance_items: "{{ rebalance_items }}"

    - name: Set average_count as a fact on all inventory hosts
      set_fact:
        # Every host reads the 'shared_average' fact from the host that calculated it
        average_count: "{{ hostvars[ansible_play_hosts[0]]['shared_average'] }}"

    - name: Verify the new fact on each host
      debug:
        msg: "Host {{ inventory_hostname }} : average_count set to {{ hostvars[inventory_hostname].average_count }} and Rebalance items: {{ hostvars[inventory_hostname].rebalance_items }}"

    - name: Identify hosts that need rebalancing
      vars:
        
      set_fact:
        rebalance_hosts: "{{ ansible_play_hosts | selectattr('rebalance_items', 'greaterthan', 0) | list }}"