---
- name: Set facts and calculate average
  hosts: cos9
  gather_facts: false
  tasks:
    - name: Set item_count for each host
      set_fact:
        # Generates a random number between 1 and 100 for testing
        item_count: "{{ (ansible_play_hosts.index(inventory_hostname) + 1) * 10 }}"

    - name: Display individual host counts
      debug:
        msg: "Host {{ inventory_hostname }} has item_count = {{ item_count }}"

- name: Calculate the average across all hosts
  hosts: localhost
  gather_facts: false
  run_once: true
  tasks:
    - name: Extract facts and calculate average
      vars:
        # 1. Pull the item_count fact from every host in the 'all' group
        # 2. Convert them to integers
        # 3. Sum and divide by the number of hosts
        all_counts: "{{ groups['all'] | map('extract', hostvars, 'item_count') | map('int') | list }}"
        total_sum: "{{ all_counts | sum }}"
        host_count: "{{ groups['all'] | length }}"
        average_count: "{{ total_sum | int / host_count | int }}"
      debug:
        msg:
          - "All counts collected: {{ all_counts }}"
          - "Total Sum: {{ total_sum }}"
          - "Total Hosts: {{ host_count }}"
          - "Average Item Count: {{ average_count }}"