---
- name: Test set facts
  hosts: all


  tasks:
    - name: Get Active Items
      ansible.builtin.shell:
        cmd: /home/prabhat/get_value.sh
      register: active_items
      changed_when: false

    - name: Print Active Items
      debug:
        var: active_items.stdout

    - name: Set Fact
      ansible.builtin.set_fact:
        active_item_count: "{{ active_items.stdout }}"

    - name: Print the custom facts of the host
      ansible.builtin.debug:
        msg: "{{ hostvars[inventory_hostname].active_item_count | int }}"

    - name: Show the active_ item_count for each host
      debug:
        msg: "Host {{ inventory_hostname }} has {{ active_item_count }} items."

- name: Calculate and display the average
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Extract all item_counts and calculate average
      vars:
        # 1. Map over all target hosts to get their 'item_count' fact
        # 2. Convert values to integers
        # 3. Sum them up and divide by the total number of hosts
        all_counts: "{{ groups['all'] | map('extract', hostvars, 'item_count') | map('int') | list }}"
        total_sum: "{{ all_counts | sum }}"
        host_count: "{{ groups['all'] | length }}"
        average_count: "{{ total_sum | int / host_count | int }}"
      debug:
        msg:
          - "All counts: {{ all_counts }}"
          - "Total Sum: {{ total_sum }}"
          - "Total Hosts: {{ host_count }}"
          - "Average Item Count: {{ average_count }}"
