---
- name: Test set facts
  hosts: node1.sriauronet.lan


  tasks:
    - name: Get Active Items
      ansible.builtin.shell:
        cmd: /home/prabhat/get_value.sh
      register: active_items
      changed_when: false

    - name: Print Active Items
      debug:
        var: active_items.stdout

    - name: Set Fact
      ansible.builtin.set_fact:
        active_item_count: "{{ active_items.stdout }}"
    - name: Print the custom facts of the host
      ansible.builtin.debug:
        msg: "{{ hostvars[ inventory_hostname ].active_item_count }} | int"